apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}
spec:
  template:
    spec:
      containers:
        - name: app
          image: example.invalid/app
          env:
            - name: TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secretName }}
                  key: token
          envFrom:
            - configMapRef:
                name: literal-config
      volumes:
        - name: credentials
          secret:
            secretName: literal-secret
