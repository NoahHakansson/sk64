apiVersion: v1
kind: Pod
spec:
  containers:
    - name: app
      image: app
      volumeMounts:
        - name: projected-volume
          mountPath: /projected
          subPath: item
  volumes:
    - name: projected-volume
      projected:
        sources:
          - secret:
              name: projected-secret
          - configMap:
              name: projected-config
          - serviceAccountToken:
              path: token
