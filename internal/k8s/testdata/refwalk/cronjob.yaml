apiVersion: batch/v1
kind: CronJob
metadata:
  name: scheduled
spec:
  schedule: "*/5 * * * *"
  jobTemplate:
    spec:
      template:
        spec:
          restartPolicy: Never
          containers:
            - name: cron-container
              image: cron
              env:
                - name: TOKEN
                  valueFrom:
                    secretKeyRef:
                      name: cron-secret
                      key: token
